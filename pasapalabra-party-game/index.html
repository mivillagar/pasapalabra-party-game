<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasapalabra Party Game</title>

<!-- ================================================================
  PASAPALABRA PARTY GAME - one file, no dependencies, works offline.

  EDITING: search for PREGUNTAS at the start of the script. Keep exactly
  27 entries in A-Z order with Ñ after N. Change only the quoted text.
  SEGUNDOS_TEMPORIZADOR controls the timer; 0 disables it. TEXTO_BOTE
  controls the scrolling banner until five questions remain.

  VOICE: the browser Web Speech API reads the current definition in
  Spanish. Selecting another letter cancels the current speech. Use the
  speaker button or V to mute it. See docs/USER_GUIDE.md for full help.
================================================================= -->

<style>
  :root{
    --azul-cielo: #3fa9f5;
    --azul-vivo: #1577e0;
    --azul-fondo: #0b4fc4;
    --azul-letra: #16307f;
    --azul-letra-claro: #2b54c9;
    --naranja: #f57c00;
    --naranja-claro: #ffb03a;
    --verde: #16a34a;
    --verde-claro: #4ade80;
    --rojo: #d0402f;
    --rojo-claro: #ef6a55;
    --blanco: #ffffff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1400px 900px at 50% -10%, var(--azul-cielo) 0%, var(--azul-vivo) 45%, var(--azul-fondo) 100%);
    color: var(--blanco);
    height:100dvh; overflow:hidden; user-select:none;
    display:flex; flex-direction:column;
  }

  /* ---------- scrolling prize banner ---------- */
  #marquee{
    flex:0 0 auto; overflow:hidden;
    background:rgba(3,33,92,.55);
    border-bottom:2px solid rgba(255,255,255,.4);
  }
  .mq-track{ display:flex; width:max-content; animation:mq-scroll 26s linear infinite; }
  .mq-track span{
    white-space:nowrap; padding:7px 0;
    color:#fff; font-weight:700;
    font-size:clamp(14px,1.8vw,21px); letter-spacing:.05em;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  @keyframes mq-scroll{ to{ transform:translateX(-50%); } }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:14px;
    padding:10px 22px; flex:0 0 auto;
  }
  header h1{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:700; font-size:clamp(18px, 2.4vw, 30px);
    letter-spacing:.06em; color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
    white-space:nowrap;
  }
  .spacer{ flex:1; }
  .circulo{
    width:clamp(58px, 8vmin, 86px); aspect-ratio:1; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:clamp(14px, 2.2vmin, 24px); color:#fff;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 3px 10px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.35);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    flex:0 0 auto;
  }
  .circulo.naranja{ background:radial-gradient(circle at 35% 30%, var(--naranja-claro), var(--naranja) 60%, #d96800); }
  .circulo.verde{ background:radial-gradient(circle at 35% 30%, var(--verde-claro), var(--verde) 60%, #0f7a38); }
  .fallos{ font-size:clamp(15px,1.8vw,22px); font-weight:700; color:#ffd7d0; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .hbtn{
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.45); border-radius:10px;
    font-size:clamp(14px,1.6vw,20px); padding:5px 12px; cursor:pointer;
    transition:background .15s;
  }
  .hbtn:hover{ background:rgba(255,255,255,.28); }
  #timer-chip.running{ box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 3px 10px rgba(0,0,0,.3); }
  #timer-chip.timeup{ animation:blink .8s infinite; }
  @keyframes blink{ 50%{ filter:brightness(1.35); } }

  /* ---------- main area ---------- */
  main{
    flex:1; display:flex; align-items:stretch; gap:8px;
    padding:4px 22px 18px; min-height:0;
  }

  /* ---------- letter ring ---------- */
  #rosco-zone{ flex:1.25; display:flex; align-items:center; justify-content:center; min-width:0; }
  #rosco{ position:relative; }
  .letra{
    position:absolute; left:0; top:0;
    width:var(--sz); height:var(--sz); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:calc(var(--sz) * .44);
    background:radial-gradient(circle at 35% 30%, var(--azul-letra-claro), var(--azul-letra) 70%);
    border:2px solid rgba(255,255,255,.75); color:#fff;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.25);
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    transition: background .2s, border-color .2s, box-shadow .2s, color .2s;
  }
  .letra:hover{ box-shadow:0 0 10px 2px rgba(255,255,255,.4), inset 0 2px 3px rgba(255,255,255,.25); }
  .letra.actual{
    background:radial-gradient(circle at 35% 30%, #ffffff, #dbe9ff 60%, #b9d4ff);
    color:var(--azul-letra); border-color:#fff; text-shadow:none;
    box-shadow:0 0 14px 3px rgba(255,255,255,.55);
    z-index:3;
  }
  .letra.ok{
    background:radial-gradient(circle at 35% 30%, var(--verde-claro), var(--verde) 60%, #0f7a38);
    border-color:#c8f7d8; color:#fff;
  }
  .letra.nok{
    background:radial-gradient(circle at 35% 30%, var(--rojo-claro), var(--rojo) 60%, #8f2318);
    border-color:#ffc4ba; color:#fff;
  }
  #centro{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none;
  }
  #centro .big{ font-family:Georgia,serif; font-size:40px; color:#fff; letter-spacing:.1em; text-shadow:0 2px 10px rgba(0,0,0,.45); }
  #centro .sub{ font-size:16px; opacity:.85; margin-top:6px; text-shadow:0 1px 4px rgba(0,0,0,.4); }

  /* ---------- question panel ---------- */
  #panel{
    flex:1; min-width:340px; max-width:560px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4);
    border-radius:20px; padding:26px 30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; overflow:auto;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
  }
  #panel .p-letra{
    font-family:Georgia,serif; font-size:clamp(40px,6vmin,64px); font-weight:700;
    color:#fff; line-height:1; text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  #panel .p-def{
    font-size:clamp(22px,3.4vmin,36px); font-weight:600; line-height:1.35;
    text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  #panel .p-resp{
    font-size:clamp(16px,2.2vmin,23px); color:#fff;
    border-top:1px dashed rgba(255,255,255,.5); padding-top:14px; width:100%;
  }
  #panel .p-resp b{ letter-spacing:.05em; }
  .botones{ display:flex; gap:16px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
  .bbtn{
    font-size:clamp(18px,2.6vmin,28px); font-weight:800; letter-spacing:.08em;
    padding:16px 34px; border-radius:16px; border:none; cursor:pointer; color:#fff;
    transition:transform .12s, filter .12s;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
  }
  .bbtn:hover{ transform:translateY(-2px); filter:brightness(1.12); }
  .bbtn:active{ transform:translateY(1px); }
  .bbtn small{ display:block; font-size:.5em; font-weight:500; opacity:.8; letter-spacing:.02em; margin-top:2px; }
  #btn-ok { background:linear-gradient(180deg,#3cb45e,#1f7a3d); }
  #btn-paso{ background:linear-gradient(180deg,#f9a825,#e65100); }
  #btn-nok{ background:linear-gradient(180deg,#e05a44,#a52a1c); }
  .bbtn:disabled{ opacity:.45; cursor:default; transform:none; filter:none; }
  #panel .hint{ font-size:clamp(20px,2.6vmin,28px); opacity:.85; font-style:italic; padding:0 10px; line-height:1.5; text-shadow:0 1px 4px rgba(0,0,0,.3); }

  /* ---------- final summary ---------- */
  #fin{
    position:fixed; inset:0; display:none;
    background:rgba(4,20,60,.8); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; z-index:50;
  }
  #fin.visible{ display:flex; }
  #fin .card{
    text-align:center; padding:48px 64px; border-radius:24px;
    background:linear-gradient(180deg,#0e63d8,#08377e);
    border:2px solid rgba(255,255,255,.8); box-shadow:0 0 60px rgba(0,0,0,.4);
  }
  #fin h2{ font-family:Georgia,serif; font-size:clamp(30px,5vmin,52px); color:#fff; margin-bottom:14px; text-shadow:0 2px 10px rgba(0,0,0,.45); }
  #fin .res{ font-size:clamp(26px,4.4vmin,44px); font-weight:800; margin:10px 0; }
  #fin .det{ font-size:clamp(16px,2.2vmin,24px); opacity:.9; margin-bottom:26px; }
  #fin button{
    font-size:clamp(18px,2.4vmin,26px); font-weight:700; padding:14px 40px;
    border-radius:14px; border:none; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,var(--naranja-claro),var(--naranja));
    box-shadow:0 3px 10px rgba(0,0,0,.3);
  }
  #fin.bote .card{
    border-color:#ffd54a;
    box-shadow:0 0 80px rgba(255,213,74,.5);
  }
  #fin.bote h2{
    font-size:clamp(38px,7vmin,76px); color:#ffd54a;
    text-shadow:0 3px 14px rgba(0,0,0,.5);
  }

  .confetti{ position:fixed; top:-12px; z-index:60; pointer-events:none; border-radius:2px; }
  #fuegos{ position:fixed; inset:0; z-index:70; pointer-events:none; }

  /* ---------- narrow screens ---------- */
  @media (max-width: 760px){
    header{ flex-wrap:wrap; gap:6px; padding:8px 10px; }
    header h1{ font-size:17px; width:100%; text-align:center; order:-1; }
    .circulo{ width:46px; font-size:13px; border-width:2px; }
    .fallos{ font-size:14px; }
    .hbtn{ font-size:13px; padding:4px 9px; }
  }
  @media (max-aspect-ratio: 1/1){
    main{ flex-direction:column; }
    #rosco-zone{ flex:1; }
    #panel{ max-width:none; min-width:0; flex:0 0 auto; padding:16px 20px; gap:10px; }
  }
</style>
</head>
<body>

<div id="marquee" aria-hidden="true"><div class="mq-track" id="mq-track"></div></div>

<header>
  <h1>Pasapalabra Party Game</h1>
  <div class="spacer"></div>
  <div class="circulo naranja" id="timer-chip" title="Timer">
    <span id="timer-num">5:00</span>
  </div>
  <button class="hbtn" id="timer-toggle" title="Start / pause (T)">▶</button>
  <button class="hbtn" id="timer-reset" title="Reset timer">⟲</button>
  <div class="circulo verde" title="Correct answers"><span id="n-ok">0</span></div>
  <div class="fallos" title="Incorrect answers">✗ <span id="n-nok">0</span></div>
  <button class="hbtn" id="timer-show" title="Show / hide timer">⏱</button>
  <button class="hbtn" id="fs-btn" title="Fullscreen (F)">⛶</button>
  <button class="hbtn" id="restart-btn" title="Restart game (R)">↺</button>
  <button class="hbtn" id="voz-btn" title="Voice: on / mute (V)">🔊</button>
</header>

<main>
  <div id="rosco-zone"><div id="rosco">
    <div id="centro"><div class="big">27</div><div class="sub">letters to play</div></div>
  </div></div>

  <div id="panel">
    <div class="hint" id="panel-hint">Select a letter<br>to start ✨</div>
    <div id="panel-q" style="display:none; width:100%; flex-direction:column; align-items:center; gap:18px;">
      <div class="p-letra" id="p-letra"></div>
      <div class="p-def" id="p-def"></div>
      <div class="p-resp">Answer: <b id="p-resp"></b></div>
      <div class="botones">
        <button class="bbtn" id="btn-ok">OK<small>1</small></button>
        <button class="bbtn" id="btn-paso">PASS<small>2</small></button>
        <button class="bbtn" id="btn-nok">NOK<small>3</small></button>
      </div>
    </div>
  </div>
</main>

<div id="fin"><div class="card">
  <h2 id="fin-titulo">Round complete! 🎉</h2>
  <div class="res"><span id="fin-ok"></span> correct out of 27</div>
  <div class="det" id="fin-det"></div>
  <button id="fin-restart">Play again</button>
</div></div>

<script>
/* ================================================================
   PREGUNTAS - EDIT HERE.
   Format: { letra: "A", definicion: "...", respuesta: "..." }
   Keep 27 entries in order: A-Z with Ñ after N. The sample clues are
   generic and contain no personal information.
================================================================ */
const PREGUNTAS = [
  { letra: "A", definicion: "Empieza por la A: Vehículo de dos ruedas que se mueve con pedales.", respuesta: "Bicicleta" },
  { letra: "B", definicion: "Empieza por la B: Esfera de jabón que flota y brilla antes de explotar.", respuesta: "Burbuja" },
  { letra: "C", definicion: "Empieza por la C: Bebida de cacao que combina muy bien con churros.", respuesta: "Chocolate" },
  { letra: "D", definicion: "Empieza por la D: Animal marino famoso por su inteligencia y sus saltos.", respuesta: "Delfín" },
  { letra: "E", definicion: "Empieza por la E: Animal grande con trompa y orejas enormes.", respuesta: "Elefante" },
  { letra: "F", definicion: "Empieza por la F: Luz brillante que se lanza al cielo durante una celebración.", respuesta: "Fuego artificial" },
  { letra: "G", definicion: "Empieza por la G: Instrumento musical de seis cuerdas.", respuesta: "Guitarra" },
  { letra: "H", definicion: "Empieza por la H: Postre frío que se derrite demasiado rápido en verano.", respuesta: "Helado" },
  { letra: "I", definicion: "Empieza por la I: Tierra rodeada de agua por todas partes.", respuesta: "Isla" },
  { letra: "J", definicion: "Empieza por la J: Animal de cuello muy largo y manchas oscuras.", respuesta: "Jirafa" },
  { letra: "K", definicion: "Empieza por la K: Arte marcial japonés cuyo nombre significa mano vacía.", respuesta: "Karate" },
  { letra: "L", definicion: "Empieza por la L: Satélite natural que ilumina muchas noches.", respuesta: "Luna" },
  { letra: "M", definicion: "Empieza por la M: Cordillera o elevación natural de gran altura.", respuesta: "Montaña" },
  { letra: "N", definicion: "Empieza por la N: Construcción que algunos pájaros hacen para poner sus huevos.", respuesta: "Nido" },
  { letra: "Ñ", definicion: "Contiene la Ñ: Fruta tropical amarilla y dulce con hojas puntiagudas.", respuesta: "Piña" },
  { letra: "O", definicion: "Empieza por la O: Gran masa de agua salada que cubre buena parte del planeta.", respuesta: "Océano" },
  { letra: "P", definicion: "Empieza por la P: Comida redonda que suele llevar tomate y queso.", respuesta: "Pizza" },
  { letra: "Q", definicion: "Empieza por la Q: Alimento elaborado con leche que puede ser curado o fresco.", respuesta: "Queso" },
  { letra: "R", definicion: "Empieza por la R: Gotas de agua que caen de las nubes.", respuesta: "Lluvia" },
  { letra: "S", definicion: "Empieza por la S: Estrella que da luz y calor a la Tierra.", respuesta: "Sol" },
  { letra: "T", definicion: "Empieza por la T: Bebida caliente preparada con hojas y agua.", respuesta: "Té" },
  { letra: "U", definicion: "Empieza por la U: Fruta pequeña que crece en racimos y puede ser verde o morada.", respuesta: "Uva" },
  { letra: "V", definicion: "Empieza por la V: Montaña que puede expulsar lava, ceniza y gases.", respuesta: "Volcán" },
  { letra: "W", definicion: "Empieza por la W: Deporte acuático que usa una tabla y una vela.", respuesta: "Windsurf" },
  { letra: "X", definicion: "Contiene la X: Prueba escrita o práctica para comprobar conocimientos.", respuesta: "Examen" },
  { letra: "Y", definicion: "Empieza por la Y: Embarcación de recreo que puede llevar motor o velas.", respuesta: "Yate" },
  { letra: "Z", definicion: "Empieza por la Z: Calzado deportivo o cómodo que cubre el pie.", respuesta: "Zapatilla" },
];

// Timer duration in seconds (300 = 5 minutes). Use 0 to disable it.
const SEGUNDOS_TEMPORIZADOR = 300;

// Scrolling banner text while more than five questions remain.
const TEXTO_BOTE = "Prize challenge: complete all 27 letters";

/* ================================================================
   Game engine - no editing is required below this line.
================================================================ */
const $ = s => document.querySelector(s);
const rosco = $("#rosco");
const mqTrack = $("#mq-track");
let estado = [];      // 'pending' | 'ok' | 'nok'
let actual = 0;       // índice de la letra seleccionada
let panelAbierto = false;
let bloqueado = false;

if (PREGUNTAS.length !== 27) {
  console.warn("PREGUNTAS should contain 27 entries; found " + PREGUNTAS.length);
}

function init(){
  callarLocutor();
  estado = PREGUNTAS.map(() => "pending");
  actual = 0; panelAbierto = false; bloqueado = false;
  rosco.querySelectorAll(".letra").forEach(e => e.remove());
  PREGUNTAS.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "letra"; d.textContent = p.letra; d.dataset.i = i;
    d.addEventListener("click", () => seleccionar(i, true));
    rosco.appendChild(d);
  });
  layout(); render(); cerrarPanel();
  const fin = $("#fin");
  fin.classList.remove("visible", "bote");
  $("#fin-titulo").textContent = "Round complete! 🎉";
  resetTimer();
}

function layout(){
  const zone = $("#rosco-zone");
  if (!zone.clientWidth || !zone.clientHeight) return; // aún sin layout: reintenta en load/resize
  const lado = Math.min(zone.clientWidth, zone.clientHeight) * 0.94;
  rosco.style.width = lado + "px";
  rosco.style.height = lado + "px";
  const n = PREGUNTAS.length;
  // 0.72 del hueco de la circunferencia: las letras nunca se tocan.
  const sz = Math.min(64, Math.max(26, (Math.PI * lado / n) * 0.72));
  const radio = lado / 2 - sz / 2;
  rosco.querySelectorAll(".letra").forEach(el => {
    const i = +el.dataset.i;
    const ang = (i / n) * 2 * Math.PI - Math.PI / 2;
    const x = lado / 2 + radio * Math.cos(ang) - sz / 2;
    const y = lado / 2 + radio * Math.sin(ang) - sz / 2;
    el.style.setProperty("--sz", sz + "px");
    el.style.transform = "translate(" + x + "px," + y + "px)";
  });
  pintarCentro(lado);
}
window.addEventListener("resize", layout);
window.addEventListener("load", () => { layout(); requestAnimationFrame(layout); });
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(document.getElementById("rosco-zone"));

function pintarCentro(lado){
  document.querySelector("#centro .big").style.fontSize = Math.round(lado*0.10) + "px";
  document.querySelector("#centro .sub").style.fontSize = Math.round(lado*0.036) + "px";
}

/* ---------- scrolling prize banner ---------- */
const PALABRAS_CUENTA = { 5: "five", 4: "four", 3: "three", 2: "two", 1: "one" };
function pintarMarquee(){
  const pend = estado.filter(e => e === "pending").length;
  const texto = (pend >= 1 && pend <= 5)
    ? PALABRAS_CUENTA[pend] + " question" + (pend === 1 ? "" : "s") + " away from the prize"
    : TEXTO_BOTE;
  const mitad = (texto + "  ✦  ").repeat(4);
  mqTrack.innerHTML = "<span>" + mitad + "</span><span>" + mitad + "</span>";
}

function render(){
  rosco.querySelectorAll(".letra").forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle("ok", estado[i] === "ok");
    el.classList.toggle("nok", estado[i] === "nok");
    el.classList.toggle("actual", i === actual && estado[i] === "pending");
  });
  $("#n-ok").textContent = estado.filter(e => e === "ok").length;
  $("#n-nok").textContent = estado.filter(e => e === "nok").length;
  pintarMarquee();
}

function seleccionar(i, abrir){
  actual = i; render();
  if (abrir) abrirPanel();
}

function abrirPanel(){
  const p = PREGUNTAS[actual];
  $("#panel-hint").style.display = "none";
  const q = $("#panel-q");
  q.style.display = "flex";
  $("#p-letra").textContent = p.letra;
  $("#p-def").textContent = p.definicion;
  $("#p-resp").textContent = p.respuesta;
  panelAbierto = true;
  setBotones(true);
  leerEnVozAlta(p.definicion);
}

function cerrarPanel(){
  callarLocutor();
  panelAbierto = false;
  $("#panel-q").style.display = "none";
  $("#panel-hint").style.display = "block";
}

function setBotones(on){
  ["#btn-ok","#btn-paso","#btn-nok"].forEach(s => $(s).disabled = !on);
}

function responder(res){ // 'ok' | 'paso' | 'nok'
  if (!panelAbierto || bloqueado) return;
  bloqueado = true; setBotones(false);
  if (res !== "paso") estado[actual] = res;
  render();
  setTimeout(() => {
    bloqueado = false;
    if (estado.every(e => e !== "pending")) { cerrarPanel(); finDelJuego(); return; }
    avanzar();
    abrirPanel();
  }, 420);
}

function avanzar(){
  const n = PREGUNTAS.length;
  for (let k = 1; k <= n; k++){
    const j = (actual + k) % n;
    if (estado[j] === "pending"){ actual = j; break; }
  }
  render();
}

function moverSeleccion(dir){
  const n = PREGUNTAS.length;
  for (let k = 1; k <= n; k++){
    const jj = ((actual + dir * k) % n + n) % n;
    if (estado[jj] === "pending"){ actual = jj; break; }
  }
  render();
  if (panelAbierto) abrirPanel();
}

/* ---------- voice announcer (Web Speech API) ---------- */
let vozActiva = true;
let vozES = null;
function buscarVozES(){
  if (!("speechSynthesis" in window)) return;
  const voces = speechSynthesis.getVoices();
  vozES = voces.find(v => /^es([-_]|$)/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){
  buscarVozES();
  speechSynthesis.onvoiceschanged = buscarVozES; // las voces cargan en diferido
}
function leerEnVozAlta(texto){
  if (!vozActiva || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel(); // corta la lectura anterior
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-ES";
  if (vozES) u.voice = vozES;
  u.rate = 1;
  speechSynthesis.speak(u);
}
function callarLocutor(){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function toggleVoz(){
  vozActiva = !vozActiva;
  if (!vozActiva) callarLocutor();
  $("#voz-btn").textContent = vozActiva ? "🔊" : "🔇";
}

/* ---------- end of game ---------- */
function finDelJuego(){
  callarLocutor();
  const ok = estado.filter(e => e === "ok").length;
  const nok = estado.filter(e => e === "nok").length;
  const perfecto = ok === PREGUNTAS.length;
  pararTimer();
  const fin = $("#fin");
  fin.classList.toggle("bote", perfecto);
  $("#fin-titulo").textContent = perfecto ? "JACKPOT WINNER!" : "Round complete! 🎉";
  $("#fin-ok").textContent = ok;
  let det = perfecto ? "Perfect round! All 27 are green" : nok + (nok === 1 ? " incorrect answer" : " incorrect answers");
  if (timerCorrio) det += " · Time: " + formatoTiempo(SEGUNDOS_TEMPORIZADOR - segundos);
  $("#fin-det").textContent = det;
  fin.classList.add("visible");
  confeti(perfecto);
  if (perfecto) lanzarFuegos(6500);
}

function confeti(grande){
  const colores = ["#ffd54a","#ffffff","#4ade80","#ef6a55","#5ab0ff","#ff8ae0","#ffb03a"];
  const total = grande ? 170 : 90;
  for (let i = 0; i < total; i++){
    const c = document.createElement("div");
    c.className = "confetti";
    const s = 6 + Math.random() * 8;
    c.style.cssText = "left:" + (Math.random()*100) + "vw;width:" + s + "px;height:" + (s*0.6) +
      "px;background:" + colores[i % colores.length] + ";";
    document.body.appendChild(c);
    c.animate([
      { transform: "translateY(0) rotate(0deg)", opacity: 1 },
      { transform: "translateY(105vh) rotate(" + (360 + Math.random()*720) + "deg)", opacity: .7 }
    ], { duration: 2600 + Math.random()*2200, easing: "cubic-bezier(.2,.6,.4,1)", delay: Math.random()*(grande ? 1600 : 700) })
    .onfinish = () => c.remove();
  }
}

/* ---------- fireworks for a perfect round ---------- */
function lanzarFuegos(duracionMs){
  const cv = document.createElement("canvas");
  cv.id = "fuegos";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  let W, H;
  const fit = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  fit();
  window.addEventListener("resize", fit);
  const COLORES = ["#ffd54a","#ff5a5a","#5aff8a","#5ab0ff","#ff8ae0","#ffffff"];
  const cohetes = [], chispas = [];
  function nuevoCohete(){
    cohetes.push({
      x: W * (0.12 + Math.random() * 0.76), y: H + 10,
      vy: -(H * 0.011 + Math.random() * H * 0.004),
      objetivo: H * (0.15 + Math.random() * 0.35),
      color: COLORES[(Math.random() * COLORES.length) | 0]
    });
  }
  function explotar(c){
    const n = 60 + ((Math.random() * 40) | 0);
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4.5;
      chispas.push({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        vida: 1, decaimiento: 0.008 + Math.random() * 0.012, color: c.color });
    }
  }
  const t0 = performance.now();
  let ultimo = 0;
  function frame(t){
    ctx.clearRect(0, 0, W, H);
    if (t - t0 < duracionMs && t - ultimo > 360){ nuevoCohete(); ultimo = t; }
    ctx.globalCompositeOperation = "lighter";
    for (let i = cohetes.length - 1; i >= 0; i--){
      const c = cohetes[i];
      c.y += c.vy;
      ctx.globalAlpha = 1; ctx.fillStyle = c.color;
      ctx.fillRect(c.x - 1.5, c.y, 3, 9);
      if (c.y <= c.objetivo){ explotar(c); cohetes.splice(i, 1); }
    }
    for (let i = chispas.length - 1; i >= 0; i--){
      const s = chispas[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.vida -= s.decaimiento;
      if (s.vida <= 0){ chispas.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, s.vida);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (t - t0 < duracionMs || cohetes.length || chispas.length){
      requestAnimationFrame(frame);
    } else {
      cv.remove();
      window.removeEventListener("resize", fit);
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- timer ---------- */
let segundos = SEGUNDOS_TEMPORIZADOR, timerId = null, timerCorrio = false;

function formatoTiempo(s){
  s = Math.max(0, s);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function pintarTimer(){
  $("#timer-num").textContent = formatoTiempo(segundos);
  $("#timer-chip").classList.toggle("timeup", segundos === 0 && SEGUNDOS_TEMPORIZADOR > 0);
}
function pararTimer(){
  clearInterval(timerId); timerId = null;
  $("#timer-toggle").textContent = "▶";
  $("#timer-chip").classList.remove("running");
}
function toggleTimer(){
  if (SEGUNDOS_TEMPORIZADOR <= 0) return;
  if (timerId){ pararTimer(); return; }
  timerCorrio = true;
  $("#timer-toggle").textContent = "⏸";
  $("#timer-chip").classList.add("running");
  timerId = setInterval(() => {
    if (segundos > 0) segundos--;
    pintarTimer();
    if (segundos === 0) pararTimer();
  }, 1000);
}
function resetTimer(){
  pararTimer();
  segundos = SEGUNDOS_TEMPORIZADOR; timerCorrio = false;
  pintarTimer();
  $("#timer-chip").classList.remove("timeup");
  if (SEGUNDOS_TEMPORIZADOR <= 0) $("#timer-chip").style.display = "none";
}

/* ---------- header controls ---------- */
$("#timer-toggle").addEventListener("click", toggleTimer);
$("#timer-reset").addEventListener("click", resetTimer);
$("#timer-show").addEventListener("click", () => {
  const chip = $("#timer-chip");
  chip.style.display = chip.style.display === "none" ? "flex" : "none";
});
$("#fs-btn").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
});
$("#restart-btn").addEventListener("click", init);
$("#fin-restart").addEventListener("click", init);
$("#voz-btn").addEventListener("click", toggleVoz);

/* ---------- botones OK / PASS / NOK ---------- */
$("#btn-ok").addEventListener("click", () => responder("ok"));
$("#btn-paso").addEventListener("click", () => responder("paso"));
$("#btn-nok").addEventListener("click", () => responder("nok"));

/* ---------- keyboard controls ---------- */
document.addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === "ArrowRight"){ moverSeleccion(1); e.preventDefault(); }
  else if (k === "ArrowLeft"){ moverSeleccion(-1); e.preventDefault(); }
  else if (k === " " || k === "Enter"){
    if ($("#fin").classList.contains("visible")) init();
    else if (!panelAbierto) abrirPanel();
    e.preventDefault();
  }
  else if (k === "Escape"){ if (panelAbierto) cerrarPanel(); }
  else if (k === "1" || k.toLowerCase() === "o") responder("ok");
  else if (k === "2" || k.toLowerCase() === "p") responder("paso");
  else if (k === "3" || k.toLowerCase() === "n") responder("nok");
  else if (k.toLowerCase() === "t") toggleTimer();
  else if (k.toLowerCase() === "f") $("#fs-btn").click();
  else if (k.toLowerCase() === "v") toggleVoz();
  else if (k.toLowerCase() === "r") init();
});

init();
</script>
